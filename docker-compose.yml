services:
  warroom:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database
      - warroom-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/warroom.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/chat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  warroom-data:
    driver: local
